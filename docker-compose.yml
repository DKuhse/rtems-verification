services:
  # Bare container for setup tasks (BSP build, etc.)
  toolchain:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtems-edf-toolchain
    volumes:
      - ./rtems:/workspace/rtems

  # Headless verification (RTEMS 5.1)
  verify:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtems-edf-toolchain
    working_dir: /workspace/rtems/src/rtems-5.1/cpukit
    volumes:
      - ./rtems:/workspace/rtems
      - ./scripts:/opt/scripts
      - ./verification:/workspace/verification
    command: ["verify-all.sh"]

  # Headless verification (RTEMS 6.2). Default invocation matches the
  # published 4,804/4,804 result. Override the command to target a
  # single function, e.g.:
  #   docker compose run --rm verify-6.2 \
  #     /opt/scripts/6.2/verify-edf-update-priority.sh \
  #     -wp -wp-fct _Scheduler_EDF_Update_priority -wp-model 'Typed+Cast'
  verify-6.2:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtems-edf-toolchain
    working_dir: /workspace/rtems/src/rtems-6.2/cpukit
    volumes:
      - ./rtems:/workspace/rtems
      - ./scripts:/opt/scripts
      - ./verification:/workspace/verification
    command: ["/opt/scripts/6.2/verify-wp-all.sh", "-wp-model", "Typed+Cast", "-wp-timeout", "30"]

  # Interactive shell with X11 forwarding for frama-c-gui
  # Usage: xhost +local:docker && docker compose run gui
  gui:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtems-edf-toolchain
    working_dir: /workspace/rtems/src/rtems-5.1/cpukit
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./rtems:/workspace/rtems
      - ./scripts:/opt/scripts
      - ./verification:/workspace/verification
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
