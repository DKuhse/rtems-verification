services:
  # Bare container for setup tasks (BSP build, etc.)
  toolchain:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtems-edf-toolchain
    volumes:
      - ./rtems:/workspace/rtems

  verify:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtems-edf-toolchain
    working_dir: /workspace/rtems/src/rtems-5.1/cpukit
    volumes:
      - ./rtems:/workspace/rtems
      - ./scripts:/opt/scripts
      - ./verification:/workspace/verification
    command: ["verify-all.sh"]

  verify-6.2-active:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtems-edf-toolchain
    working_dir: /workspace/rtems/src/rtems-6.2-pristine/cpukit
    volumes:
      - ./rtems:/workspace/rtems
      - ./scripts:/opt/scripts
      - ./verification:/workspace/verification
    command: ["/opt/scripts/6.2/verify-edf-unblock.sh"]

  verify-6.2-active-fc32:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRAMA_C_VERSION: "32.0"
        INSTALL_COQ: "true"
    image: rtems-edf-toolchain-fc32
    working_dir: /workspace/rtems/src/rtems-6.2-pristine/cpukit
    volumes:
      - ./rtems:/workspace/rtems
      - ./scripts:/opt/scripts
      - ./verification:/workspace/verification
    command: ["/opt/scripts/6.2/verify-edf-unblock.sh"]

  verify-5.1-fc32:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRAMA_C_VERSION: "32.0"
    image: rtems-edf-toolchain-fc32
    working_dir: /workspace/rtems/src/rtems-5.1-pristine/cpukit
    volumes:
      - ./rtems:/workspace/rtems
      - ./scripts:/opt/scripts
      - ./verification:/workspace/verification
    command: ["/opt/scripts/5.1/verify-edf-initialize.sh"]

  verify-5.1:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtems-edf-toolchain
    working_dir: /workspace/rtems/src/rtems-5.1-pristine/cpukit
    volumes:
      - ./rtems:/workspace/rtems
      - ./scripts:/opt/scripts
      - ./verification:/workspace/verification
    command: ["/opt/scripts/5.1/verify-edf-initialize.sh"]

  verify-freertos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRAMA_C_VERSION: "32.0"
        INSTALL_COQ: "true"
    image: rtems-edf-toolchain-fc32
    working_dir: /workspace/source/freertos-edf-msp430
    volumes:
      - ./source:/workspace/source
      - ./scripts:/opt/scripts
      - ./verification:/workspace/verification
    command: ["/opt/scripts/freertos/verify-wp-all.sh", "-wp-timeout", "30"]